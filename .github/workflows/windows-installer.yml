name: Windows installer

# The installer can only be produced on Windows: PyInstaller bundles the
# interpreter of the machine it runs on, so it does not cross-compile. Run this
# from the Actions tab, or push a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content app\__init__.py -Raw
          if ($content -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw 'Could not read __version__ from app\__init__.py'
          }
          "value=$($Matches[1])" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # build.ps1 runs the test suite itself and stops on a failure, so there
      # is no separate test step to keep in sync with it.
      - name: Build
        shell: pwsh
        run: .\build.ps1 -Clean -Installer

      - name: Checksum
        shell: pwsh
        run: |
          $setup = "dist\installer\401KFinderPro-Setup-${{ steps.version.outputs.value }}.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "SHA256  $hash" | Tee-Object dist\installer\SHA256.txt
          "### 401K Finder Pro ${{ steps.version.outputs.value }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "SHA256  $hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: 401KFinderPro-Setup-${{ steps.version.outputs.value }}
          path: |
            dist/installer/*.exe
            dist/installer/SHA256.txt
          if-no-files-found: error
          retention-days: 30
